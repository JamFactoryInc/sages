[package]
name = "sages"
version = "0.1.0"
edition = "2021"

[dependencies]
hyper = { version = "1.2", features = ["http1", "server"] }
tokio = { version = "1.36", features = ["macros", "net", "rt", "rt-multi-thread", "time"] }
http-body-util = "0.1"
hyper-util = { version = "0.1.3", features = ["server", "tokio"] }
preload = { path = "./preload" }
mysql_async = { version = "0.34", default-features = false, features = ["minimal-rust"] }
